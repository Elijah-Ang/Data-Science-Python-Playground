name: Validate ML routes

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:
    inputs:
      full_runtime:
        description: "Execute every generated route in Python (slower)"
        required: false
        type: boolean
        default: false

jobs:
  structural:
    name: Structural route audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check ml-app.js
      - name: Check route dependency-state behaviour
        run: node tests/test_ml_state.mjs
      - name: Check Practice metadata, scaffolds, and checkpoints
        run: node tests/test_ml_practice_final.mjs
      - name: Check supervised teaching metadata and summaries
        run: node tests/test_ml_teaching.mjs
      - name: Check every dataset/scenario/model route
        run: python tests/test_ml_routes.py

  runtime:
    name: Representative Python runtime audit
    runs-on: ubuntu-latest
    needs: structural
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.10"
      - name: Install Pyodide-parity route-audit dependencies
        run: python -m pip install -r tests/requirements-pyodide-parity.txt
      - name: Verify Pyodide 0.26.4 package versions
        run: python tests/check_pyodide_versions.py
      - name: Execute Data tasks and trust regressions
        run: python tests/test_data_runtime.py
      - name: Execute route runtime audit
        run: python tests/test_ml_routes.py --runtime representative

  full-runtime:
    name: Full 254-route runtime audit (Pyodide parity)
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_runtime == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [structural, runtime]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.10"
      - name: Install Pyodide-parity route-audit dependencies
        run: python -m pip install -r tests/requirements-pyodide-parity.txt
      - name: Verify Pyodide 0.26.4 package versions
        run: python tests/check_pyodide_versions.py
      - name: Execute all 254 generated routes
        run: python tests/test_ml_routes.py --runtime full

  browser-smoke:
    name: Browser/Pyodide route smoke test (${{ matrix.engine }})
    strategy:
      matrix:
        engine: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: structural
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Build shared web/app assets
        run: |
          npm ci
          npm run build:web
          npm run check:app-shell
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: python -m pip install playwright==1.52.0
      - name: Install browser engine
        run: python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Start local site
        run: nohup python -m http.server 8000 -d dist > /tmp/ml-playground-http.log 2>&1 &
      - name: Run revised supervised and unsupervised Pyodide smoke routes
        run: python tests/test_ml_workflow_browser.py --engine ${{ matrix.engine }} --base-url http://127.0.0.1:8000/ml.html
      - name: Check revised landing and notebook controls
        run: python tests/test_ui_preferences_browser.py --engine ${{ matrix.engine }} --base-url http://127.0.0.1:8000
      - name: Check guided tour chapters and replay
        run: python tests/test_tutorial_browser.py --engine ${{ matrix.engine }} --base-url http://127.0.0.1:8000
      - name: Check automatic notebook session contract
        run: python tests/test_notebook_session_browser.py --engine ${{ matrix.engine }} --base-url http://127.0.0.1:8000
      - name: Check product trust and responsive public pages
        run: python tests/test_product_browser.py --engine ${{ matrix.engine }} --base-url http://127.0.0.1:8000
