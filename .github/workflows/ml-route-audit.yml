name: Validate ML routes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_runtime:
        description: "Execute every generated route in Python (slower)"
        required: false
        type: boolean
        default: false

jobs:
  structural:
    name: Structural route audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check ml-app.js
      - name: Check every dataset/scenario/model route
        run: python tests/test_ml_routes.py

  runtime:
    name: Representative Python runtime audit
    runs-on: ubuntu-latest
    needs: structural
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install route-audit dependencies
        run: python -m pip install "numpy<3" "pandas<3" "scikit-learn>=1.4,<2" "scipy<2" "matplotlib<4" "seaborn<0.14"
      - name: Execute route runtime audit
        shell: bash
        run: |
          if [[ "${{ inputs.full_runtime }}" == "true" ]]; then
            python tests/test_ml_routes.py --runtime full
          else
            python tests/test_ml_routes.py --runtime representative
          fi
