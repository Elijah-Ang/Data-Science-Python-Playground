name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Add deployment marker
        run: printf '%s\n' "$GITHUB_SHA" > pages-deployment-sha.txt

      - name: Upload site artifact
        id: upload
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/github-script@v9.0.0
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          PAGES_DEPLOY_TIMEOUT_MS: '1800000'
        with:
          script: |
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID)
            const buildVersion = process.env.GITHUB_SHA
            const timeoutMs = Number(process.env.PAGES_DEPLOY_TIMEOUT_MS)
            const { owner, repo } = context.repo

            if (!Number.isInteger(artifactId) || artifactId <= 0) {
              throw new Error(`Invalid Pages artifact ID: ${process.env.PAGES_ARTIFACT_ID}`)
            }

            const oidcToken = await core.getIDToken()
            const deploymentResponse = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner,
              repo,
              artifact_id: artifactId,
              pages_build_version: buildVersion,
              oidc_token: oidcToken
            })
            const deployment = deploymentResponse.data
            const deploymentId = deployment.id || deployment.status_url?.split('/').pop() || buildVersion
            const pageUrl = `https://${owner.toLowerCase()}.github.io/${repo}/`
            const markerUrl = `${pageUrl}pages-deployment-sha.txt?commit=${buildVersion}`
            const deadline = Date.now() + timeoutMs

            core.info(`Created Pages deployment ${deploymentId}; polling for up to ${timeoutMs} ms.`)

            const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds))
            const isPublished = async () => {
              const markerResponse = await fetch(markerUrl, { headers: { 'cache-control': 'no-cache' } })
              if (!markerResponse.ok) return false
              return (await markerResponse.text()).trim() === buildVersion
            }

            while (Date.now() < deadline) {
              await sleep(5000)
              const statusResponse = await github.request(
                'GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}',
                { owner, repo, deploymentId }
              )
              const status = statusResponse.data.status
              core.info(`Current Pages deployment status: ${status}`)

              if (status === 'succeed' || (status === 'deployment_in_progress' && await isPublished())) {
                core.setOutput('page_url', pageUrl)
                core.info(`Pages deployment confirmed at ${pageUrl}`)
                return
              }

              if (['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'].includes(status)) {
                throw new Error(`Pages deployment failed with status: ${status}`)
              }
            }

            await github.request(
              'POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel',
              { owner, repo, deploymentId }
            )
            throw new Error(`Pages deployment timed out after ${timeoutMs} ms`)
