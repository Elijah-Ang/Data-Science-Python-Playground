name: Statistics production audit

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  numerical:
    name: Exhaustive Statistics numerical audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'
      - name: Install pinned numerical dependencies
        run: |
          python -m pip install -r tests/requirements-pyodide-parity.txt
          python -m pip install statsmodels==0.14.2 patsy==0.5.6
      - name: Preserve numerical oracles and validate production schema/base
        run: python -m unittest discover -s statistics/tests -p 'test_*.py' -q
      - name: Execute every finite configuration and cross-permutation invariant
        run: python statistics/audit/routes.py --workers 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: statistics-exhaustive-configurations-and-code-surface
          path: statistics/audit/results/

  browser:
    name: Statistics production browser and visual contract (${{ matrix.engine }})
    needs: numerical
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Build production artifact
        run: |
          npm ci
          npm run build:web
          npm run check:js
          npm run check:app-shell
      - name: Install numerical/browser dependencies
        run: python -m pip install playwright==1.52.0 numpy==1.26.4 pandas==2.2.0 scipy==1.12.0 matplotlib==3.8.4 statsmodels==0.14.2 patsy==0.5.6
      - name: Install browser
        run: python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Serve actual production build
        run: nohup python -m http.server 8000 -d dist > /tmp/statistics-http.log 2>&1 &
      - name: Compare Data / Statistics / ML controls and responsive layouts
        run: python tests/test_statistics_integration_browser.py --engine ${{ matrix.engine }} --base-url http://127.0.0.1:8000
      - name: Execute all Statistics method/design variants in production Pyodide
        run: python statistics/tests/test_browser.py --engine ${{ matrix.engine }} --url http://127.0.0.1:8000/statistics.html --allow-remote
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: statistics-production-${{ matrix.engine }}
          path: |
            tests/evidence/statistics/
            statistics/tests/artifacts/
