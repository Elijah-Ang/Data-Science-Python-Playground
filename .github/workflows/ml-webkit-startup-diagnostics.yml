name: Focused ML WebKit startup diagnostics

on:
  push:
    branches: [codex/ml-webkit-startup-diagnostics-2026-10-12]

permissions:
  contents: read

jobs:
  webkit:
    name: Existing CDN WebKit route check with failure diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Build shared web/app assets
        run: |
          npm ci
          npm run build:web
          npm run check:app-shell
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: python -m pip install playwright==1.52.0
      - name: Install WebKit
        run: python -m playwright install --with-deps webkit
      - name: Start local site
        run: nohup python -m http.server 8000 -d dist > /tmp/ml-playground-http.log 2>&1 &
      - name: Run unchanged CDN route assertions and readiness limit
        run: python tests/test_ml_workflow_browser.py --engine webkit --base-url http://127.0.0.1:8000/ml.html
      - name: Preserve failure-only startup evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: webkit-startup-failure-${{ github.sha }}
          path: work/ml-browser/startup-failure.json
          if-no-files-found: warn
