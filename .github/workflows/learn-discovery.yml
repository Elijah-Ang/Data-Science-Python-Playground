name: Learn discovery flow
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: Learn discovery and landing regression (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - run: npm ci && npm run check
      - run: python -m pip install playwright==1.52.0
      - run: python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Serve built site
        run: nohup python -m http.server 8000 -d dist > /tmp/discovery-http.log 2>&1 &
      - run: python tests/test_learn_discovery_browser.py --base-url http://127.0.0.1:8000 --engine ${{ matrix.engine }}
      - run: python tests/test_landing_refresh_browser.py --base-url http://127.0.0.1:8000 --engine ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learn-discovery-${{ matrix.engine }}
          path: tests/evidence/learn-discovery/
