<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Welcome to Data Playground — a playful home for exploring, visualising, and modelling data with Python.">
  <meta name="theme-color" content="#efe8d7">
  <meta name="application-name" content="Data Playground">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Data Playground">
  <title>Welcome · Data Playground</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/app-icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="landing.css?v=ipad-portrait1">
  <script src="app-platform.js"></script>
</head>
<body class="landing-page" data-theme="light">
  <main class="welcome-shell">
    <section class="welcome-intro" aria-labelledby="welcome-title">
      <p class="welcome-kicker">DATA SCIENCE PYTHON PLAYGROUND</p>
      <h1 id="welcome-title">Welcome to <em>Data Playground</em></h1>
      <p class="welcome-subtitle">Explore, clean, visualise, model, and discover.</p>
    </section>

    <section class="scene-section" aria-labelledby="scene-title">
      <h2 id="scene-title" class="sr-only">Enter Data Playground</h2>
      <div class="scene-frame" data-scene>
        <picture class="scene-picture">
          <source media="(max-width: 720px), (orientation: portrait)" srcset="assets/landing/data-playground-mobile-source.png">
          <source media="(min-width: 721px)" srcset="assets/landing/data-playground-desktop-source.png">
          <img class="scene-art" src="assets/landing/data-playground-desktop-source.png" alt="A static pixel-art garden playground with friendly robots, a treehouse, a pond, and a gate marked Enter Data Playground" fetchpriority="high" decoding="async">
        </picture>

        <a class="gate-hitbox" href="playground.html" aria-label="Enter Data Playground">
          <picture class="gate-glow" aria-hidden="true">
            <source media="(max-width: 720px), (orientation: portrait)" srcset="assets/landing/gate-glow-mobile.png">
            <source media="(min-width: 721px)" srcset="assets/landing/gate-glow-desktop.png">
            <img src="assets/landing/gate-glow-desktop.png" alt="" decoding="async">
          </picture>
        </a>
      </div>
      <p class="scene-hint">Tap the gate to enter</p>
    </section>
  </main>

  <script src="landing.js?v=static-scene1"></script>
</body>
</html>
